services:
  guacd:
    image: guacamole/guacd:1.6.0
    container_name: helix-guacd
    restart: unless-stopped
    ports:
      - "4822:4822"

  postgres:
    image: postgres:16-alpine
    container_name: helix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: guacamole_password
    volumes:
      - helix-pg:/var/lib/postgresql/data

  guacamole:
    image: guacamole/guacamole:1.6.0
    container_name: helix-guacamole
    restart: unless-stopped
    depends_on:
      - guacd
      - postgres
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: 4822
      POSTGRES_HOSTNAME: postgres
      POSTGRES_DATABASE: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: guacamole_password
      WEBAPP_CONTEXT: ROOT
    ports:
      - "8080:8080"
    profiles:
      - stock-ui

volumes:
  helix-pg:
