services:
  guacd:
    image: guacamole/guacd:1.6.0
    container_name: helix-guacd
    restart: unless-stopped
    ports:
      - "4822:4822"

  # Helix's own persistence (users, connections, grants, activity). Point the
  # backend's DATABASE_URL at this to survive restarts; leave DATABASE_URL
  # unset to keep the zero-config in-memory demo mode.
  app-db:
    image: postgres:16-alpine
    container_name: helix-app-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: helix
      POSTGRES_USER: helix
      POSTGRES_PASSWORD: helix
    ports:
      - "5433:5432"
    volumes:
      - helix-app-db:/var/lib/postgresql/data

  # Guacamole's own database (only used by the optional stock-ui profile below).
  postgres:
    image: postgres:16-alpine
    container_name: helix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: guacamole_password
    volumes:
      - helix-pg:/var/lib/postgresql/data
    profiles:
      - stock-ui

  guacamole:
    image: guacamole/guacamole:1.6.0
    container_name: helix-guacamole
    restart: unless-stopped
    depends_on:
      - guacd
      - postgres
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: 4822
      POSTGRES_HOSTNAME: postgres
      POSTGRES_DATABASE: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: guacamole_password
      WEBAPP_CONTEXT: ROOT
    ports:
      - "8080:8080"
    profiles:
      - stock-ui

volumes:
  helix-pg:
  helix-app-db:
